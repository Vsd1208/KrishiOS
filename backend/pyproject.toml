[project]
name = "krishios-backend"
version = "0.1.0"
description = "Production backend foundation for KrishiOS."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Sprint 0/1 — core infrastructure ────────────────────────────────────
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi[standard]>=0.115.0,<1.0.0",
    "greenlet>=3.1.0,<4.0.0",
    "loguru>=0.7.3,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "redis>=5.2.0,<6.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    # ── Sprint 2 — knowledge infrastructure ─────────────────────────────────
    "aiofiles>=24.1.0,<25.0.0",
    "langchain-text-splitters>=0.3.0,<1.0.0",
    "Pillow>=11.0.0,<12.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-multipart>=0.0.20",
    "pytesseract>=0.3.13,<1.0.0",
    "qdrant-client>=1.19.0,<2.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "google-genai>=1.0.0,<2.0.0",
    # ── Sprint 5 — Identity and Authentication ──────────────────────────────
    "argon2-cffi>=23.1.0,<24.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    # ── Sprint 6 — Knowledge Graph & GraphRAG ────────────────────────────────
    "neo4j>=5.18.0,<6.0.0",
    "psutil>=6.0.0,<8.0.0",
    "arq>=0.26.0,<1.0.0",
]

[project.optional-dependencies]
local-ml = [
    "av>=14.0.0,<16.0.0",
    "faster-whisper>=1.1.0,<2.0.0",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.0",
]
# Local NVIDIA GPU (laptop RTX 2050, 4 GB): `uv sync --extra local-ml --extra gpu`, then
# ML_DEVICE=auto|cuda. CUDA wheels come from PyTorch's cu130 index (ADR-015). Default (no extra)
# keeps the CPU build from PyPI, which is what the container uses.
gpu = [
    "torch>=2.14,<2.15",
]
cpu = [
    "torch>=2.13",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only torch comes from this index

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "S101",
    # Multilingual product: Devanagari/Telugu digits and scripts are intentional (Sprint 11).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
