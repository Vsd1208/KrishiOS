units:
  kg: [kg, kgs, kilogram, kilograms, "कि.ग्रा.", किलोग्राम, किलो, కిలో, కిలోలు, "కి.గ్రా."]
  g: [g, gm, gms, gram, grams, ग्राम, గ్రాము, గ్రాములు, "గ్రా."]
  ml: [ml, millilitre, millilitres, milliliter, milliliters, "मि.ली.", मिलीलीटर, "మి.లీ.", మిల్లీలీటర్లు]
  l: [l, lt, ltr, litre, litres, liter, liters, लीटर, "ली.", లీటరు, లీటర్లు]
  ha: [ha, hectare, hectares, हेक्टेयर, హెక్టారు, హెక్టార్లు]
  acre: [acre, acres, एकड़, ఎకరం, ఎకరా, ఎకరాలు]  # ఎకరా: oblique stem (ఎకరానికి = per acre)
  mm: [mm, millimetre, millimetres, millimeter, मिमी, "मि.मी.", "మి.మీ."]
  cm: [cm, centimetre, centimetres, सेमी, "సెం.మీ."]
  degc: ["°c", "°", celsius, सेल्सियस, సెల్సియస్]
  pct: ["%", percent, प्रतिशत, శాతం]
  kmph: [kmph, "km/h", "km/hr", "कि.मी./घंटा", "కి.మీ./గం."]
  quintal: [quintal, quintals, qtl, क्विंटल, క్వింటాల్, క్వింటాళ్లు]
  rupee: ["₹", rs, "rs.", rupees, रुपये, रुपए, రూపాయలు]
