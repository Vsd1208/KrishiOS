# KrishiOS agri glossary (Sprint 11). Status: DRAFT, pending native-speaker review (te, hi).
# - protected_terms are never translated (kept verbatim, Latin script).
# - units maps a canonical unit to its spellings in en/hi/te; used by the number/unit check.
# - crop names are mapped from ml/reference/crop_catalog.csv at runtime (not duplicated here).
version: "2026.11.0-draft"

