# KrishiOS NLU lexicon (Sprint 11). Status: DRAFT, pending native-speaker review (te, hi).
# Phrases are matched on normalised tokens: whole tokens for Latin script; Telugu and
# Devanagari phrases may carry short inflectional suffixes on their last token.
# Priority resolves ties (higher wins). "yield" outranks "weather" so that
# "yield forecast" is never routed to the weather agent.
version: "2026.11.0-draft"

intents:
  yield:
    priority: 90
    phrases:
      en: [yield, yields, harvest estimate, production estimate, expected harvest, how much harvest, quintals per acre, output per acre, yield forecast, yield outlook]
      hi: [उपज, पैदावार, उत्पादन अनुमान, कितनी पैदावार]
      te: [దిగుబడి, దిగుబడులు, పంట దిగుబడి, ఉత్పత్తి అంచనా]
      roman: [upaj, paidavar, paidawar, digubadi, digubadulu]
