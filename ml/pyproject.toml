[project]
name = "krishios-ml"
version = "0.1.0"
description = "KrishiOS research and training code: Yield Intelligence, vision, and multilingual evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=17.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "loguru>=0.7.3,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
# Heavier groups are installed per phase: `uv sync --extra eval` etc.
eval = [
    "sacrebleu>=2.4.0,<3.0.0",
    "jiwer>=3.0.0,<5.0.0",
    "pymupdf>=1.24.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishios_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks/*.ipynb"]  # generated by notebooks/build_colab_notebook.py

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
