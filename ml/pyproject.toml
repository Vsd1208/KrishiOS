[project]
name = "krishios-ml"
version = "0.1.0"
description = "KrishiOS research and training code: Yield Intelligence, vision, and multilingual evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=17.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "loguru>=0.7.3,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "rasterio>=1.4",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Heavier groups are installed per phase: `uv sync --extra eval` etc.
eval = [
    "sacrebleu>=2.4.0,<3.0.0",
    "jiwer>=3.0.0,<5.0.0",
    "pymupdf>=1.24.0,<2.0.0",
]
# CUDA PyTorch for local GPU training/benchmarks (Phases 9-10; laptop RTX 2050, 4 GB).
# Install: `uv sync --extra gpu` (~3 GB). Verify: `uv run python scripts/check_gpu.py`.
# Wheels come from PyTorch's CUDA 13.0 index (driver reports CUDA 13.3); see [tool.uv.sources].
gpu = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29",
    "timm>=1.0",
    "open-clip-torch>=2.29",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu130", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # only torch/torchvision come from this index

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krishios_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks/*.ipynb"]  # generated by notebooks/build_colab_notebook.py

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
